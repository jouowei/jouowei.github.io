<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>截圖轉文字</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f2937">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --bg:#f4f4f2; --card:#fff; --ink:#1f2937; --mute:#6b7280; --line:#e5e7eb; --acc:#c2410c; --ok:#15803d; --warn:#b45309; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.6 -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--ink); color:#fff; padding:16px 16px 14px; padding-top:calc(16px + env(safe-area-inset-top)); }
  header h1 { margin:0; font-size:20px; }
  header p { margin:2px 0 0; font-size:13px; color:#d1d5db; }
  main { max-width:720px; margin:0 auto; padding:12px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .card h2 { margin:0 0 10px; font-size:17px; }
  button, .btn { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:9px 14px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  button:disabled { opacity:.45; cursor:default; }
  .primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  .big { width:100%; padding:13px; font-size:17px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .row > button { flex:1 1 auto; }
  .hint { color:var(--mute); font-size:13px; margin:8px 0 0; }
  .status { font-size:14px; margin:10px 0 0; white-space:pre-line; }
  .status.ok { color:var(--ok); } .status.warn { color:var(--warn); } .status.err { color:#b91c1c; }
  #thumbs { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px; margin-top:12px; }
  .thumb { position:relative; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fafafa; }
  .thumb img { display:block; width:100%; height:130px; object-fit:cover; object-position:top; }
  .thumb .no { position:absolute; top:4px; left:4px; background:var(--ink); color:#fff; border-radius:999px; min-width:22px; height:22px; font-size:13px; display:flex; align-items:center; justify-content:center; padding:0 6px; }
  .thumb .h { font-size:11px; color:var(--mute); text-align:center; padding:2px 0 0; }
  .thumb .tools { display:flex; }
  .thumb .tools button { flex:1; border:0; border-top:1px solid var(--line); border-radius:0; padding:6px 0; background:#fff; }
  #preview { max-height:60vh; overflow-y:auto; border:1px solid var(--line); border-radius:10px; background:#fff; }
  #preview img, #preview canvas { display:block; width:100%; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; margin-bottom:12px; font-size:15px; }
  .opts select { font:inherit; padding:4px; border-radius:8px; border:1px solid var(--line); max-width:100%; }
  @media (max-width:420px) { .opts { grid-template-columns:1fr; } }
  progress { width:100%; height:12px; margin-top:12px; accent-color:var(--acc); }
  textarea { width:100%; font:15px/1.7 inherit; font-family:inherit; border:1px solid var(--line); border-radius:10px; padding:10px; resize:vertical; }
  label.block { display:block; margin-top:12px; font-size:14px; color:var(--mute); }
  label.block textarea { margin-top:4px; color:var(--ink); }
  footer { max-width:720px; margin:0 auto; padding:4px 16px calc(24px + env(safe-area-inset-bottom)); color:var(--mute); font-size:12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>截圖轉文字</h1>
  <p>長截圖或多張截圖 → 自動拼接 → 文字檔 → 分享給 Claude</p>
</header>
<main>
  <section class="card" id="step-pick">
    <h2>① 選截圖</h2>
    <label class="btn primary big">選擇截圖<input id="file" type="file" accept="image/*" multiple hidden></label>
    <button id="btn-install" class="big" style="margin-top:8px" hidden>安裝到主畫面</button>
    <p class="hint">可以選一張長截圖，或連續截好幾張（相鄰兩張要有幾行重疊）。順序會依內容自動排好。
      Android 安裝到主畫面後，也可以從相簿選圖直接「分享」到這個工具。</p>
    <div id="thumbs"></div>
    <div class="row" id="order-tools" hidden>
      <button id="btn-auto">依內容排序</button>
      <button id="btn-reverse">反轉順序</button>
      <button id="btn-clear">全部清除</button>
    </div>
    <p class="status" id="stitch-status"></p>
  </section>

  <section class="card" id="step-preview" hidden>
    <h2>② 拼接結果</h2>
    <div id="preview"></div>
    <p class="hint">紅色記號是接縫位置，可以滑過去確認有沒有重複或漏掉的行。</p>
    <div class="row"><button id="btn-dl-img">下載長圖</button></div>
  </section>

  <section class="card" id="step-ocr" hidden>
    <h2>③ 轉成文字</h2>
    <div class="opts">
      <label>文字　<select id="opt-lang">
        <option value="chi_tra">繁體中文</option>
        <option value="chi_tra+eng">繁中＋英文</option>
        <option value="chi_sim">簡體中文</option>
        <option value="eng">英文</option>
      </select></label>
      <label>版面　<select id="opt-psm">
        <option value="6">文章（單欄）</option>
        <option value="3">自動（聊天、複雜版面）</option>
      </select></label>
      <label><input type="checkbox" id="opt-tw" checked> 轉成台灣用字</label>
      <label><input type="checkbox" id="opt-quote" checked> 引號改用「」</label>
      <label><input type="checkbox" id="opt-para" checked> 合併成段落</label>
      <label><input type="checkbox" id="opt-fix" checked> 修正常見辨識錯字</label>
    </div>
    <button id="btn-ocr" class="primary big">開始轉文字</button>
    <progress id="ocr-progress" max="1" value="0" hidden></progress>
    <p class="status" id="ocr-status"></p>
  </section>

  <section class="card" id="step-out" hidden>
    <h2>④ 文字檔</h2>
    <textarea id="out" rows="14" spellcheck="false"></textarea>
    <p class="hint" id="out-count"></p>
    <label class="block">給 Claude 的指示（分享時放在最前面，可留白）
      <textarea id="prompt" rows="2"></textarea></label>
    <div class="row">
      <button id="btn-share-text" class="primary">分享給 Claude</button>
      <button id="btn-share-file">分享 .txt 檔</button>
    </div>
    <div class="row">
      <button id="btn-copy">複製全文</button>
      <button id="btn-dl-txt">下載 .txt</button>
    </div>
    <div class="row"><button id="btn-share-img">改傳切好的圖片給 Claude（辨識最準）</button></div>
    <p class="status" id="share-status"></p>
  </section>
</main>
<footer>
  圖片只在這支手機上處理，不會上傳到任何伺服器；只有你按「分享」時，才會交給你選的 App。
  第一次轉文字會下載約 7 MB 的辨識程式與模型，之後會留在手機上。
</footer>
<script src="stitch.js"></script>
<script src="textproc.js"></script>
<script src="app.js"></script>
</body>
</html>
